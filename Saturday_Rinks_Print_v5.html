<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moorabbin Saturday — Printable Rink Results v5</title>
<style>
:root{--blue:#0057B8;--ink:#142235;--muted:#52657b;--line:#cbd8e8;--green:#087a42;--red:#b42318}
*{box-sizing:border-box}html,body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
body{padding:12px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--blue);padding-bottom:5px;margin-bottom:5px}
h1{margin:0;font-size:23px;color:var(--blue)}.subtitle{font-size:11px;color:var(--muted);margin-top:2px}#updated{font-size:9px;text-align:right}
#roundLabel{text-align:center;font-size:12px;font-weight:bold;margin:4px 0 6px}#printToolbar{text-align:center;margin:5px 0 8px}#printToolbar button{padding:5px 12px;font-weight:bold;cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:start}
.side-card{border:1px solid #888;min-width:0;break-inside:avoid;overflow:hidden}
.card-head{background:#eee;padding:3px 5px;display:flex;justify-content:space-between;gap:4px;align-items:center;border-bottom:1px solid #888}
.side-title{font-size:12px;font-weight:900}.division{font-size:8px;white-space:nowrap}
.matchup{padding:3px 5px;border-bottom:1px solid #aaa}.teams{font-size:9px;font-weight:bold}.overall{font-size:12px;font-weight:900;display:inline-block;margin-right:5px}.match-state{font-size:8px;display:inline}.extract-state{font-size:7px;color:#555;margin-top:2px}.extract-state.ok{color:#086338}.extract-state.warn{color:#795900}.extract-state.fail{color:#a32018}
.rinks{padding:2px 4px}.rink-row{display:grid;grid-template-columns:27px minmax(0,1fr) 42px;gap:3px;align-items:center;border-bottom:1px solid #ddd;padding:2px 1px;min-height:0}.rink-row:last-child{border-bottom:0}.rink-label{font-size:8px;font-weight:bold}.player-list{font-size:8px;line-height:1.2;min-width:0;overflow-wrap:anywhere}.player-list strong{font-size:7px}.player-pair{display:flex;gap:8px;min-width:0}.player-item{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-role{font-weight:900;color:#334b66;margin-right:2px}.rink-score{text-align:center;font-size:10px;font-weight:bold;white-space:nowrap}.rink-score.pending{font-size:8px}.moor-win{background:#f0f0f0}.opp-win{background:#fff}.draw{background:#fafafa}.biggest-win{background:#ffe36e!important;outline:2px solid #111;outline-offset:-2px;font-weight:bold}.biggest-win .rink-label:after{content:' ★';color:#111}.note{font-size:9px;padding:5px}
@media print{
 @page{size:A4 landscape;margin:5mm}
 html,body{width:100%;height:100%;margin:0!important;padding:0!important;background:#fff!important}
 header{margin:0 0 2mm;padding:0 0 1.5mm;border-bottom:1px solid #333}
 h1{font-size:15pt!important;color:#111!important}.subtitle{font-size:7pt!important;color:#333!important}#updated{font-size:6.5pt!important;color:#333!important}
 #printToolbar,.footer{display:none!important}#roundLabel{font-size:8pt!important;margin:1mm 0 2mm!important}
 #grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important;gap:2mm!important;height:calc(100vh - 17mm);min-height:0!important;align-items:stretch}
 .side-card{height:100%;border:0.5pt solid #555!important;border-radius:0!important;box-shadow:none!important}
 .card-head{padding:1mm 1.5mm!important;background:#eee!important;color:#111!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .side-title{font-size:8.5pt!important}.division{font-size:6pt!important}
 .matchup{padding:1mm 1.5mm!important}.teams{font-size:7pt!important}.overall{font-size:8pt!important}.match-state{font-size:6pt!important}.extract-state{font-size:5.5pt!important;margin-top:.5mm!important}
 .rinks{padding:.5mm 1mm!important}.rink-row{grid-template-columns:9mm minmax(0,1fr) 13mm!important;gap:1mm!important;padding:.7mm .5mm!important;min-height:0!important;break-inside:avoid;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .rink-label{font-size:6.5pt!important}.player-list{font-size:7pt!important;line-height:1.18!important}.player-list strong{font-size:6pt!important}.player-pair{gap:2mm}.player-item{font-size:7pt!important}.player-role{margin-right:.5mm}.rink-score{font-size:8pt!important}.rink-score.pending{font-size:6pt!important}
 .moor-win{background:#f0f0f0!important}.biggest-win{background:#ffe36e!important;outline:1.5pt solid #111!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .note{font-size:6pt!important;padding:1mm!important}
}
</style>
</head>
<body>
<header>
  <div><h1>MOORABBIN SATURDAY PENNANT</h1><div class="subtitle">Current-season live results · verified BowlsLink rink extraction · six-side print layout</div></div>
  <div id="updated">Connecting to BowlsLink…</div>
</header>
<div id="printToolbar"><button type="button" onclick="window.print()">Print rink results</button><span>Prints the six Moorabbin sides with scores and player names.</span></div>
<div id="roundLabel">Loading current round…</div>
<div id="grid"></div>
<div class="footer">Moorabbin Bowls Club · Live BowlsLink rink scores and player names</div>
<script>
const API='https://api.bowlslink.com.au/results-api';
// Current-season mode: select the round for today in Melbourne, or the latest scheduled round before today.
const SIDES=[
 {side:'Moorabbin 1',division:1,section:3,id:'edef60fa-ab99-4b0d-808b-d12705045d5a'},
 {side:'Moorabbin 2',division:2,section:7,id:'235b23e2-6439-41ce-9496-5ba1e7bad93f'},
 {side:'Moorabbin 3',division:4,section:5,id:'75bb1ac6-df23-46cc-935f-32f3a4ed626b'},
 {side:'Moorabbin 4',division:4,section:7,id:'75bb1ac6-df23-46cc-935f-32f3a4ed626b'},
 {side:'Moorabbin 5',division:6,section:7,id:'7b49fc55-f3df-47c6-a39f-d45cf26af9f2'},
 {side:'Moorabbin 6',division:8,section:5,id:'be1987f2-5aa4-4e65-a30f-e9145c80876f',rinkCount:3}
];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function get(path){const r=await fetch(API+path+'?v=print2-'+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.json()}
function resources(p,type){return (p?.include||[]).filter(x=>x.type===type)}
function attrMap(p,type){const o={};resources(p,type).forEach(x=>o[x.id]=x.attributes||{});return o}
function parseMatches(p,forcedPool){
 const competitors=attrMap(p,'competitor'),results=attrMap(p,'multiFormatResult');
 const matches=resources(p,'match').filter(m=>m.attributes?.pool===forcedPool&&!m.attributes?.isFinalsSeries);
 return matches.map(m=>{
  const c1=m.includes?.competitorOne?.id,c2=m.includes?.competitorTwo?.id;
  if(!c1||!c2)return null;
  const rid=m.includes?.result?.id,r=rid?results[rid]:null,done=!!r?.isCompleted;
  return {id:m.id,round:Number(m.attributes?.round??0),dateUtc:m.attributes?.matchDayUtc??null,
   n1:competitors[c1]?.name||'Unknown',n2:competitors[c2]?.name||'Unknown',c1,c2,
   s1:done?Number(r.competitorOneScore??0):null,s2:done?Number(r.competitorTwoScore??0):null,completed:done};
 }).filter(Boolean).sort((a,b)=>a.round-b.round);
}
function dayKey(value){
  if(value===null||value===undefined||value==='')return null;
  // BowlsLink matchDayUtc is commonly a Unix timestamp in SECONDS.
  // JavaScript Date expects milliseconds, so convert seconds before parsing.
  let d;
  if(typeof value==='number'||(typeof value==='string'&&/^\d+(?:\.\d+)?$/.test(value.trim()))){
    const n=Number(value);
    if(!Number.isFinite(n))return null;
    d=new Date(Math.abs(n)<1e11?n*1000:n);
  }else{
    // A date-only ISO value already represents the fixture's calendar date.
    if(typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value.trim())){
      return Number(value.slice(0,4)+value.slice(5,7)+value.slice(8,10));
    }
    d=new Date(value);
  }
  if(!Number.isFinite(d.getTime()))return null;
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Melbourne',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  const part=k=>parts.find(p=>p.type===k)?.value;
  return Number(`${part('year')}${part('month')}${part('day')}`);
}
function todayMelbourneKey(){
 const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Melbourne',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const part=k=>parts.find(p=>p.type===k)?.value;
 return Number(`${part('year')}${part('month')}${part('day')}`);
}
function currentRound(rows){
  // Choose today's Melbourne fixture round if present; otherwise the latest
  // round dated before today. Never select a future round merely because its
  // fixture exists. If no dates are today or in the past, fall back to the
  // lowest round number (normally Round 1).
  const today=todayMelbourneKey();
  const dated=rows.map(m=>({round:Number(m.round),day:dayKey(m.dateUtc)}))
    .filter(x=>Number.isFinite(x.round)&&x.round>0&&x.day!==null);
  const todayRows=dated.filter(x=>x.day===today);
  if(todayRows.length)return Math.min(...todayRows.map(x=>x.round));
  const pastDays=[...new Set(dated.filter(x=>x.day<today).map(x=>x.day))].sort((a,b)=>b-a);
  if(pastDays.length){
    const latest=pastDays[0];
    return Math.max(...dated.filter(x=>x.day===latest).map(x=>x.round));
  }
  const rounds=[...new Set(rows.map(m=>Number(m.round)).filter(n=>Number.isFinite(n)&&n>0))].sort((a,b)=>a-b);
  return rounds.length?rounds[0]:null;
}
function playerName(attrs){
 if(!attrs)return '';
 for(const k of ['displayName','fullName','name','playerName','formattedName'])if(attrs[k])return String(attrs[k]);
 const first=attrs.firstName||attrs.givenName||attrs.forename||'';
 const last=attrs.lastName||attrs.familyName||attrs.surname||'';
 return [first,last].filter(Boolean).join(' ').trim();
}
function positionText(cp){
 const a=cp?.attributes||{};
 return String(a.assignedPosition??a.defaultPosition??a.positionName??a.position??a.role??a.playerPosition??a.order??'').toLowerCase();
}
function getPlayersFromRefs(refs,cpMap){
 const list=refs.map(ref=>cpMap[ref.id]).filter(Boolean);
 return list.map((cp,index)=>({
  name:playerName(cp.attributes)||playerName(cp.includes?.entrant?.attributes)||playerName(cp.includes?.player?.attributes),
  position:positionText(cp), index
 })).filter(p=>p.name).sort((a,b)=>{
  const rank=t=>/lead/.test(t)?1:/second/.test(t)?2:/third/.test(t)?3:/skip|fourth|4th/.test(t)?4:99;
  return rank(a.position)-rank(b.position)||a.index-b.index;
 }).map(p=>({name:p.name,position:/lead/.test(p.position)?'Lead':/second/.test(p.position)?'Second':/third/.test(p.position)?'Third':/skip|fourth|4th/.test(p.position)?'Skip':''}));
}
function parseRinks(detail,match){
 const inc=detail?.include||detail?.included||[];
 const cpMap={};
 for(const x of inc){if(x.type==='competitorPlayer')cpMap[x.id]=x;}
 const raw=[];
 for(const x of inc){
  if(x.type!=='rinkMatchResult')continue;
  const a=x.attributes||{};
  const oneRefs=x.includes?.competitorOnePlayers||[];
  const twoRefs=x.includes?.competitorTwoPlayers||[];
  const onePlayers=oneRefs.map(z=>cpMap[z.id]).filter(Boolean);
  const twoPlayers=twoRefs.map(z=>cpMap[z.id]).filter(Boolean);
  const idsFor=players=>[...new Set(players.map(p=>p.includes?.competitor?.id).filter(Boolean))];
  const oneIds=idsFor(onePlayers),twoIds=idsFor(twoPlayers);
  let c1=oneIds[0]||x.includes?.competitorOne?.id||null;
  let c2=twoIds[0]||x.includes?.competitorTwo?.id||null;
  const rinkRef=x.includes?.rinkMatch?.id||'';
  const belongsById=!!(match.id && (rinkRef===match.id || rinkRef.endsWith('::'+match.id) || rinkRef.endsWith('/'+match.id)));
  const belongsByTeams=(c1===match.c1&&c2===match.c2)||(c1===match.c2&&c2===match.c1);
  if(!belongsById&&!belongsByTeams)continue;
  const num=keys=>{for(const k of keys){if(a[k]!==undefined&&a[k]!==null&&a[k]!==''){const n=Number(a[k]);if(Number.isFinite(n))return n}}return null};
  const raw1=num(['competitorOneShots','competitorOneScore','scoreOne','teamOneScore','oneScore','shotsOne']);
  const raw2=num(['competitorTwoShots','competitorTwoScore','scoreTwo','teamTwoScore','twoScore','shotsTwo']);
  if(raw1===null||raw2===null)continue;
  // Use player-linked competitor IDs to orient scores to the schedule's team order.
  // If that relationship is absent, retain API competitor-one/two order rather than dropping valid rink scores.
  let flipped=false;
  if(c1===match.c2&&c2===match.c1)flipped=true;
  else if(!belongsByTeams && oneIds.length && twoIds.length){
   if(oneIds.includes(match.c2)||twoIds.includes(match.c1))flipped=true;
  }
  const s1=flipped?raw2:raw1,s2=flipped?raw1:raw2;
  const refs1=flipped?twoRefs:oneRefs,refs2=flipped?oneRefs:twoRefs;
  const numSpec=String(a.specialisation||'');
  const specNum=Number((numSpec.match(/(?:team|rink)\s*(\d+)/i)||[])[1]);
  const n=specNum||num(['rinkNumber','rink','rinkNo','number','rinkOrder','position','sequence']);
  const names=refs=>refs.map(ref=>cpMap[ref.id]).filter(Boolean).map(cp=>({
   name:playerName(cp.attributes)||playerName(cp.includes?.entrant?.attributes)||playerName(cp.includes?.player?.attributes),
   position:positionText(cp)
  })).filter(p=>p.name).sort((a,b)=>{
   const rank=t=>/lead/.test(t)?1:/second/.test(t)?2:/third/.test(t)?3:/skip|fourth|4th/.test(t)?4:99;
   return rank(a.position)-rank(b.position);
  }).map(p=>({name:p.name,position:/lead/.test(p.position)?'Lead':/second/.test(p.position)?'Second':/third/.test(p.position)?'Third':/skip|fourth|4th/.test(p.position)?'Skip':''}));
  raw.push({number:n,s1,s2,players1:names(refs1),players2:names(refs2),sort:n??999});
 }
 raw.sort((a,b)=>a.sort-b.sort);
 return raw.map((r,i)=>({...r,number:r.number??i+1}));
}
function statusText(m,side){
 if(!m)return 'Fixture not found';
 if(!m.completed)return 'Scores not entered yet';
 if(m.s1===m.s2)return 'DRAW';
 return ((/moorabbin/i.test(m.n1)&&m.s1>m.s2)||(/moorabbin/i.test(m.n2)&&m.s2>m.s1))?'MOORABBIN WIN':'MOORABBIN LOSS';
}
function renderCard(cfg,match,detail,error){
 const div=`DIV ${cfg.division} · SEC ${cfg.section}`;
 if(error)return `<section class="side-card"><div class="card-head"><span class="side-title">${esc(cfg.side)}</span><span class="division">${div}</span></div><div class="note">API extraction FAILED: ${esc(error.message||'Unknown error')}. Retrying automatically.</div></section>`;
 if(!match)return `<section class="side-card"><div class="card-head"><span class="side-title">${esc(cfg.side)}</span><span class="division">${div}</span></div><div class="note">API responded, but no Moorabbin fixture was extracted for the selected round. Matches found: ${cfg.matchCount??0}. Round detected: ${cfg.round??'none'}.</div></section>`;
 const isM1=/moorabbin/i.test(match.n1);
 const moName=isM1?match.n1:match.n2,oppName=isM1?match.n2:match.n1;
 const overall=match.completed?`${isM1?match.s1:match.s2} – ${isM1?match.s2:match.s1}`:'VS';
 const rinks=parseRinks(detail,match);
 const scoreCount=rinks.filter(r=>r.s1!==null&&r.s2!==null).length;
 const playerCount=rinks.reduce((n,r)=>n+r.players1.length+r.players2.length,0);
 const moPlayers=rinks.reduce((n,r)=>n+((/moorabbin/i.test(match.n1)?r.players1:r.players2).length),0);
 const expectedRinks=cfg.rinkCount??4;
 const expectedPlayers=expectedRinks*4;
 const extractionClass=scoreCount===expectedRinks&&moPlayers===expectedPlayers?'ok':scoreCount>0?'warn':'fail';
 const extractionText=`EXTRACTION: ${scoreCount}/${expectedRinks} rink scores · ${moPlayers}/${expectedPlayers} Moorabbin players${detail?' · match detail loaded':' · match detail FAILED'}`;
 const rows=[];
 for(let i=0;i<expectedRinks;i++){
  const r=rinks[i];
  if(!r){rows.push(`<div class="rink-row"><div class="rink-label">RINK ${i+1}</div><div class="player-list"><strong>${esc(moName)}</strong>Players unavailable</div><div class="rink-score pending">—</div><div class="skip"><strong>Opposition</strong>Score pending</div></div>`);continue;}
  const moScore=isM1?r.s1:r.s2,oppScore=isM1?r.s2:r.s1;
  const moPlayers=isM1?r.players1:r.players2;
  const cls=moScore>oppScore?'moor-win':moScore<oppScore?'opp-win':'draw';
  rows.push(`<div class="rink-row ${cls}" data-margin="${moScore-oppScore}"><div class="rink-label">RINK ${esc(r.number)}</div><div class="player-list"><strong>${esc(moName)}</strong>${moPlayers.length?`<div class="player-pair">${moPlayers.slice(0,2).map(p=>`<span class="player-item"><span class="player-role">${esc(p.position||'')}</span>${esc(p.name)}</span>`).join('')}</div><div class="player-pair">${moPlayers.slice(2,4).map(p=>`<span class="player-item"><span class="player-role">${esc(p.position||'')}</span>${esc(p.name)}</span>`).join('')}</div>`:'Players not extracted'}</div><div class="rink-score">${moScore}–${oppScore}</div></div>`);
 }
 return `<section class="side-card">
  <div class="card-head"><span class="side-title">${esc(cfg.side)}</span><span class="division">${div}</span></div>
  <div class="matchup"><div class="teams">${esc(moName)} <span style="color:#657384">vs</span> ${esc(oppName)}</div><div class="overall">${overall}</div><div class="match-state">${esc(statusText(match,cfg.side))}</div><div class="extract-state ${extractionClass}">${esc(extractionText)}</div></div>
  <div class="rinks">${rows.join('')}</div>
 </section>`;
}
async function load(){
 const cards=await Promise.all(SIDES.map(async cfg=>{
  try{
   const comp=await get('/competition/'+cfg.id+'/matches');
   const rows=parseMatches(comp,cfg.section);
   const round=currentRound(rows);
   const roundRows=round===null?[]:rows.filter(m=>m.round===round);
   const match=roundRows.find(m=>/moorabbin/i.test(m.n1)||/moorabbin/i.test(m.n2))||null;
   let detail=null,detailError=null;
   if(match){try{detail=await get('/match/'+match.id)}catch(e){detailError=e}}
   return {cfg,match,detail,detailError,round,matchCount:roundRows.length,error:false};
  }catch(e){console.error(cfg.side,e);return {cfg,error:e,round:null};}
 }));
 const roundNums=cards.map(x=>x.round).filter(x=>x!==null&&x!==undefined);
 const common=roundNums.length?Math.max(...roundNums):null;
 document.getElementById('roundLabel').textContent=common===null?'CURRENT SEASON · NO ROUND IDENTIFIED':`CURRENT SEASON · ROUND ${common} · LIVE RESULTS`; 
 document.getElementById('grid').innerHTML=cards.map(x=>renderCard(x.cfg,x.match,x.detail,x.error)).join('');
 // Highlight the Moorabbin rink with the largest winning margin across all six sides.
 const winningRows=[...document.querySelectorAll('.rink-row.moor-win[data-margin]')].filter(el=>Number(el.dataset.margin)>0);
 if(winningRows.length){const best=Math.max(...winningRows.map(el=>Number(el.dataset.margin)));winningRows.filter(el=>Number(el.dataset.margin)===best).forEach(el=>el.classList.add('biggest-win'));}
 const failures=cards.filter(x=>x.error).length;
 const detailsFailed=cards.filter(x=>x.match&&x.detailError).length;
 const extracted=cards.filter(x=>x.match&&x.detail).map(x=>parseRinks(x.detail,x.match));
 const rinkTotal=extracted.reduce((n,rs)=>n+rs.length,0);
 const playerTotal=extracted.reduce((n,rs)=>n+rs.reduce((k,r)=>k+r.players1.length+r.players2.length,0),0);
 document.getElementById('updated').textContent=`Updated ${new Date().toLocaleTimeString()} · API errors ${failures} · rinks ${rinkTotal} · players ${playerTotal}`;
}
load();
setInterval(load,15000);
</script>
</body>
</html>
