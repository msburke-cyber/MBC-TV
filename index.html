<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moorabbin Bowls Club — Live Pennant Display</title>
<style>
:root{--bg:#f4f6f8;--ink:#17202a;--muted:#657384;--line:#d8e0e8;--blue:#0d5c98;--blue2:#e8f3ff;--green:#087a42;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
#app{min-height:100vh;padding:2.2vw 3.2vw}
header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}
h1{margin:0;font-size:clamp(34px,4.4vw,64px);letter-spacing:-.02em}.sub{margin-top:5px;color:var(--muted);font-size:clamp(19px,2vw,29px)}
#updated{color:var(--muted);font-size:15px;white-space:nowrap}
.screen{display:none}.screen.active{display:block}.title{font-weight:800;font-size:clamp(32px,3.5vw,52px);margin:4px 0 14px}
.meta{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:clamp(15px,1.4vw,21px);margin-bottom:12px}
.card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.match{display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid #edf1f5;font-size:clamp(24px,2.6vw,40px)}
.match:last-child{border-bottom:0}.right{text-align:right}.score{text-align:center;font-weight:900}.pending{font-size:.7em;color:var(--muted);font-weight:600}.moor{background:var(--blue2);border-radius:9px;padding:5px 9px;font-weight:800}.win{color:var(--green)}.loss{color:var(--red)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:clamp(20px,2.1vw,32px)}
th,td{padding:10px 13px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{background:#edf1f5;font-size:.7em;text-transform:uppercase;letter-spacing:.05em;color:#4c5a68}.highlight{background:var(--blue2);font-weight:800}
.notice{padding:18px;background:#fff3cd;color:#664d03;border-radius:12px;font-size:19px}.error{background:#fdecec;color:#8d1f1f}
.controls{position:fixed;right:12px;bottom:12px;display:flex;gap:7px;opacity:.25}.controls:hover{opacity:1}
button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;font-size:14px}
@media(max-width:800px){#app{padding:16px}.match{grid-template-columns:minmax(0,1fr) 90px minmax(0,1fr);padding:10px}.controls{display:none}}
</style>

<style id="moorabbin-customisation">
:root{
  --mb-navy:#002B5C;
  --mb-gold:#F2C300;
  --mb-light:#F4F7FB;
  --mb-line:#B8C4D3;
}
body{
  background:linear-gradient(135deg,var(--mb-navy) 0%,#071B33 100%) !important;
}
header,.header,.titlebar,.topbar{
  background:var(--mb-navy) !important;
  border-bottom:5px solid var(--mb-gold) !important;
}
h1,h2,h3,.title,.heading{
  color:var(--mb-gold) !important;
}
.card,.panel,.ladder,.results,.section{
  border-color:rgba(242,195,0,.45) !important;
}
table{
  border-collapse:separate !important;
  border-spacing:0 !important;
}
thead th{
  background:var(--mb-navy) !important;
  color:white !important;
}
tbody tr{
  background:white !important;
}
tbody tr.moorabbin,
tbody tr.highlight,
tbody tr.is-moorabbin{
  background:#FFF4B8 !important;
  color:#111 !important;
  font-weight:800 !important;
  border-left:7px solid var(--mb-gold) !important;
}
tbody tr.moorabbin td,
tbody tr.highlight td,
tbody tr.is-moorabbin td{
  color:#111 !important;
}
/* Clear finals/qualifying cut line after 4th place. */
.ladder tbody tr:nth-child(4){
  border-bottom:5px solid var(--mb-navy) !important;
}
.ladder tbody tr:nth-child(5) td{
  border-top:5px solid var(--mb-navy) !important;
}
/* Generic fallback for tables identified as ladder tables. */
.ladder-table tbody tr:nth-child(4),
#ladderTable tbody tr:nth-child(4){
  border-bottom:5px solid var(--mb-navy) !important;
}
.ladder-table tbody tr:nth-child(5) td,
#ladderTable tbody tr:nth-child(5) td{
  border-top:5px solid var(--mb-navy) !important;
}
</style>

<style id="consolidated-results-style">
.consolidated-results-screen{background:rgba(255,255,255,.98);border-radius:16px;padding:14px 18px;box-sizing:border-box}
.consolidated-results-screen .cr-title{color:#0057B8;font-weight:900;font-size:clamp(32px,3vw,50px);text-align:center;line-height:1.05;margin:0 0 5px}
.consolidated-results-screen .cr-round{text-align:center;color:#36536f;font-weight:800;font-size:clamp(18px,1.4vw,26px);margin-bottom:9px}
.cr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 14px}
.cr-card{background:#fff;border:2px solid #0057B8;border-radius:9px;overflow:hidden}
.cr-card .cr-head{display:flex;justify-content:space-between;align-items:center;background:#0057B8;color:#fff;padding:6px 10px;font-size:clamp(17px,1.45vw,25px);font-weight:900}
.cr-card .cr-head small{font-size:.7em;font-weight:800}
.cr-table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.08vw,20px)}
.cr-table th{background:#eaf3ff;color:#0057B8;padding:4px 6px;font-weight:900}
.cr-table td{padding:4px 6px;border-top:1px solid #dbe3ec}
.cr-table .team{font-weight:700}
.cr-table .score{text-align:center;font-weight:900;white-space:nowrap;width:105px}
.cr-table .status{text-align:center;font-weight:900;width:58px}
.cr-table tr.moorabbin{background:#eaf3ff}
.cr-table tr.moorabbin .team{font-weight:900}
.cr-table tr.pending{opacity:.68}
.cr-error{padding:8px;text-align:center;font-weight:800}
@media(max-width:1050px){.cr-grid{grid-template-columns:1fr}.cr-table{font-size:17px}}
</style>


<style id="midweek-ladders-style">
.midweek-screen-wrap{background:rgba(255,255,255,.98);border-radius:12px;padding:8px 10px;box-sizing:border-box}
.midweek-screen-wrap .mw-title{color:#0057B8;font-weight:900;font-size:clamp(28px,2.6vw,42px);text-align:center;line-height:1;margin:0 0 7px}

.midweek-card .mw-meta{text-align:center;color:#36536f;font-size:clamp(11px,.85vw,15px);font-weight:700;padding:2px}

</style>


<style id="ipad-landscape-fit">

  .cr-table td{padding:2px 4px}

  /* Compact individual ladders. */
  table{font-size:clamp(16px,1.8vw,21px)}

</style>

<script>
const API='https://api.bowlslink.com.au/results-api';
const SIDES=[
 {side:'Moorabbin 1',division:1,section:3,id:'1c41f56a-5ae7-4f9d-946c-a48290737905'},
 {side:'Moorabbin 2',division:3,section:7,id:'281725b1-ec9c-4dd1-859c-7edbc7e6e0f5'},
 {side:'Moorabbin 3',division:4,section:7,id:'c7f527d0-d2f4-471c-bfcc-877be369e54a'},
 {side:'Moorabbin 4',division:5,section:7,id:'f943d1ad-6e95-4cab-bc17-642a6413e243'},

const SATURDAY_CONSOLIDATED=[
 {side:'Moorabbin 1',id:'1c41f56a-5ae7-4f9d-946c-a48290737905',label:'Div 1 — Sec 3'},
 {side:'Moorabbin 2',id:'281725b1-ec9c-4dd1-859c-7edbc7e6e0f5',label:'Div 3 — Sec 7'},
 {side:'Moorabbin 3',id:'c7f527d0-d2f4-471c-bfcc-877be369e54a',label:'Div 4 — Sec 7'},
 {side:'Moorabbin 4',id:'f943d1ad-6e95-4cab-bc17-642a6413e243',label:'Div 5 — Sec 7'},
 {side:'Moorabbin 5',id:'8be3fe65-4b53-4864-bf13-e46d3c8fef3e',label:'Div 6 — Sec 7'}
];


const MIDWEEK=[
 {side:'Moorabbin 1',id:'ad7cbf21-c0a3-44a2-8c28-ce79df287533'},
 {side:'Moorabbin 2',id:'1eb60506-920d-49d3-bebb-6267e2440bff'},
 {side:'Moorabbin 3',id:'fbfe145f-d10d-4a14-9004-5e6dabbb4464'}
];
const TUESDAY=[
 {side:'Moorabbin Tuesday 1',id:'49ee7645-63ff-4feb-b7a8-769f187a1e84'},
 {side:'Moorabbin Tuesday 2',id:'3f0b0ab2-3557-429c-8428-f43225bea889'},
 {side:'Moorabbin Tuesday 3',id:'24f34f6d-4a16-464e-abc2-00220deed3ba'},
 {side:'Moorabbin Tuesday 4',id:'7590d80f-b7ca-4cb6-bcc0-1ce328469ee7'}
];

let screenIndex=0, running=true, screens=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function get(path){
 const r=await fetch(API+path+'?v='+Date.now(),{cache:'no-store'});
 if(!r.ok) throw new Error(r.status+' '+r.statusText);
 return r.json();
}
function includes(p,type){return (p.include||[]).filter(x=>x.type===type)}
function attrsMap(p,type){const o={};includes(p,type).forEach(x=>o[x.id]=x.attributes||{});return o}

function extractCompetitionName(p){
 const c=includes(p,'competition')[0];
 return c?.attributes?.name || '';
}

function parseCompetition(p){
 const competitors=attrsMap(p,'competitor');
 const results=attrsMap(p,'multiFormatResult');
 const matches=includes(p,'match');
 const moorId=Object.keys(competitors).find(id=>/moorabbin/i.test(competitors[id].name||''));
 let pool=null;
 if(moorId){
   const mm=matches.find(m=>{
     const a=m.includes?.competitorOne?.id,b=m.includes?.competitorTwo?.id;
     return a===moorId||b===moorId;
   });
   pool=mm?.attributes?.pool ?? null;
 }
 const rawSection=pool===null?matches:matches.filter(m=>
   m.attributes?.pool===pool && !m.attributes?.isFinalsSeries
 );

 const allRows=[];
 for(const m of rawSection){
   const c1=m.includes?.competitorOne?.id,c2=m.includes?.competitorTwo?.id;
   if(!c1||!c2) continue;
   const rid=m.includes?.result?.id;
   const r=rid?results[rid]:null;
   const completed=!!r?.isCompleted;
   allRows.push({
     id:m.id,round:m.attributes?.round??0,state:m.attributes?.matchState||'',
     dateUtc:m.attributes?.matchDayUtc??null,
     n1:competitors[c1]?.name||'Unknown',n2:competitors[c2]?.name||'Unknown',
     s1:completed?Number(r.competitorOneScore??0):null,
     s2:completed?Number(r.competitorTwoScore??0):null,
     p1:completed?Number(r.competitorOnePoints??0):null,
     p2:completed?Number(r.competitorTwoPoints??0):null,
     resultStatus:r?.status||'',
     apiWinner:completed?(r?.winnerId||null):null,
     winner:completed?(Number(r.competitorOneScore??0)>Number(r.competitorTwoScore??0)?c1:Number(r.competitorTwoScore??0)>Number(r.competitorOneScore??0)?c2:(r?.winnerId===c1?c1:r?.winnerId===c2?c2:null)):null,
     c1,c2,completed
   });
 }
 allRows.sort((a,b)=>Number(a.round)-Number(b.round));

 const rounds=allRows.map(m=>Number(m.round)).filter(Number.isFinite);
 const currentRound=rounds.length?Math.max(...rounds):null;
 const sectionMatches=allRows.filter(m=>
   currentRound===null || Number(m.round)===currentRound
 );

 return {
   competitors,results,matches:sectionMatches,allMatches:allRows,
   pool,moorId,name:extractCompetitionName(p),currentRound
 };
}
const matchDetailCache=new Map();

async function getMatchDetail(matchId){
 if(matchDetailCache.has(matchId)) return matchDetailCache.get(matchId);
 const promise=get('/match/'+matchId).catch(()=>null);
 matchDetailCache.set(matchId,promise);
 return promise;
}

function numAttr(a, keys){
 for(const k of keys){
   if(a && a[k]!==undefined && a[k]!==null && a[k]!==''){
     const n=Number(a[k]);
     if(Number.isFinite(n)) return n;
   }
 }
 return null;
}

function rinkResultsFromDetail(detail,c1,c2){
 const inc=detail?.include||[];
 const players={};
 for(const i of inc){
   if(i.type==='competitorPlayer'){
     players[i.id]={competitorId:i.includes?.competitor?.id||null};
   }
 }
 const out=[];
 for(const i of inc){
   if(i.type!=='rinkMatchResult') continue;
   const a=i.attributes||{};
   const oneRefs=i.includes?.competitorOnePlayers||[];
   const twoRefs=i.includes?.competitorTwoPlayers||[];
   const oneIds=oneRefs.map(x=>players[x.id]?.competitorId).filter(Boolean);
   const twoIds=twoRefs.map(x=>players[x.id]?.competitorId).filter(Boolean);
   let rc1=oneIds[0]||null, rc2=twoIds[0]||null;

   // Some payloads may identify the competitors directly.
   rc1=rc1||i.includes?.competitorOne?.id||null;
   rc2=rc2||i.includes?.competitorTwo?.id||null;

   if(!(rc1===c1 && rc2===c2) && !(rc1===c2 && rc2===c1)) continue;

   const s1Raw=numAttr(a,['competitorOneScore','scoreOne','teamOneScore','oneScore','competitorOneShots','shotsOne']);
   const s2Raw=numAttr(a,['competitorTwoScore','scoreTwo','teamTwoScore','twoScore','competitorTwoShots','shotsTwo']);
   if(s1Raw===null || s2Raw===null) continue;

   const s1=(rc1===c1)?s1Raw:s2Raw;
   const s2=(rc1===c1)?s2Raw:s1Raw;
   out.push({s1,s2});
 }
 return out;
}

async function computeLadder(parsed){
 const stats={};
 const ensure=id=>stats[id]??={played:0,wins:0,losses:0,draws:0,score:0,against:0,points:0};

 for(const m of (parsed.allMatches||[])){
   if(!m.completed || String(m.state).toUpperCase()!=='PLAYED') continue;

   const a=ensure(m.c1),b=ensure(m.c2);
   a.played++; b.played++;
   a.score+=Number(m.s1||0); a.against+=Number(m.s2||0);
   b.score+=Number(m.s2||0); b.against+=Number(m.s1||0);

   const detail=await getMatchDetail(m.id);
   const rinks=rinkResultsFromDetail(detail,m.c1,m.c2);

   // BowlsLink match points are the overall points PLUS the rink points.
   // Normally the result record supplies this total directly. However,
   // a forfeit may have no rink records and the total can therefore omit
   // the implicit four rink wins. Detect the actual forfeit status and add
   // the four missing rink-win points (4 x 2 = 8).
   const status=String(m.resultStatus||'').toLowerCase();
   const isForfeit=/forfeit|walkover/.test(status);
   const winner=m.winner||m.apiWinner||null;

   // Start with the BowlsLink match-point total; normal played matches are cross-checked below.
   let matchPts1=Number(m.p1||0);
   let matchPts2=Number(m.p2||0);

   if(isForfeit && winner){
     // Forfeit match records already contain BowlsLink's full awarded points
     // in competitorOnePoints/competitorTwoPoints. Do NOT add another 8.
     // This is important because a four-rink forfeit is already 18 points
     // (10 overall + 8 rink points) in the match result.
     matchPts1=Number(m.p1||0);
     matchPts2=Number(m.p2||0);
   }else if(rinks.length){
     // Cross-check/derive rink points from actual rink results. Use the
     // overall component from the match-point total, then replace the rink
     // component with the rink-level calculation.
     const base1=m.s1>m.s2?10:(m.s1===m.s2?5:0);
     const base2=m.s2>m.s1?10:(m.s1===m.s2?5:0);
     let rink1=0,rink2=0;
     for(const r of rinks){
       if(r.s1>r.s2) rink1+=2;
       else if(r.s2>r.s1) rink2+=2;
       else {rink1++;rink2++;}
     }
     matchPts1=base1+rink1;
     matchPts2=base2+rink2;
   }

   a.points+=matchPts1;
   b.points+=matchPts2;

   if(winner===m.c1){a.wins++;b.losses++}
   else if(winner===m.c2){b.wins++;a.losses++}
   else {a.draws++;b.draws++}
 }

 return Object.entries(stats)
   .map(([id,s])=>({id,name:parsed.competitors[id]?.name||'Unknown',...s,diff:s.score-s.against}))
   .sort((a,b)=>b.points-a.points||b.diff-a.diff||b.score-a.score)
   .map((x,i)=>({...x,pos:i+1}));
}
function resultLabel(m){
 if(!m.completed)return '<span class="pending">Not yet entered</span>';
 const mo=/moorabbin/i.test(m.n1)?m.c1:/moorabbin/i.test(m.n2)?m.c2:null;
 if(m.winner===mo)return 'WIN';
 if(m.winner)return 'LOSS';
 return 'DRAW';
}
function renderResults(s,p){
 const matches=p.matches;
 const body=matches.length?matches.map(m=>{
   const mo1=/moorabbin/i.test(m.n1),mo2=/moorabbin/i.test(m.n2);
   const label=m.completed?`${m.s1} – ${m.s2}`:'—';
   let cls='';
   if(m.completed && (mo1||mo2)) cls=m.winner===null?'':(m.winner===(mo1?m.c1:m.c2)?'win':'loss');
   return `<div class="match"><div class="${mo1?'moor':''}">${esc(m.n1)}</div><div class="score ${cls}">${label}<div>${m.completed&& (mo1||mo2)?'<small>'+resultLabel(m)+'</small>':''}</div></div><div class="right ${mo2?'moor':''}">${esc(m.n2)}</div></div>`;
 }).join(''):'<div class="notice">No matches found for this section.</div>';
 s.innerHTML=`<div class="title">${esc(SIDES.find(x=>x.id===p.id)?.side||'')} — DIVISION ${p.division} SECTION ${p.section} — RESULTS</div><div class="meta"><span>${esc(p.name||'')}</span><span>${p.pool===null?'Section could not be identified':`Section ${p.section} (pool ${p.pool})`}</span><span>${p.currentRound===null?'Current round not yet identified':`Round ${p.currentRound} only`}</span></div><div class="card">${body}</div>`;
}
async function renderLadder(s,p){
 const ladder=await computeLadder(p);
 const body=ladder.length?`<table><thead><tr><th>Pos</th><th>Club</th><th>P</th><th>W</th><th>L</th><th>D</th><th>For</th><th>Agst</th><th>Diff</th><th>Pts</th></tr></thead><tbody>${ladder.map(x=>`<tr class="${/moorabbin/i.test(x.name)?'highlight':''}"><td>${x.pos}</td><td>${esc(x.name)}</td><td>${x.played}</td><td>${x.wins}</td><td>${x.losses}</td><td>${x.draws}</td><td>${x.score}</td><td>${x.against}</td><td>${x.diff>0?'+':''}${x.diff}</td><td>${x.points}</td></tr>`).join('')}</tbody></table>`:'<div class="notice">No completed results yet for this section.</div>';
 s.innerHTML=`<div class="title">${esc(SIDES.find(x=>x.id===p.id)?.side||'')} — DIVISION ${p.division} SECTION ${p.section} — LADDER</div><div class="meta"><span>${esc(p.name||'')}</span><span>All completed Section ${p.section} matches • BowlsLink points</span></div>${body}`;
}


async function loadConsolidatedResults(){
 const host=document.getElementById('consolidatedResults');
 if(!host) return;
 const sections=[];
 let commonRound=null;

 for(const cfg of SATURDAY_CONSOLIDATED){
  try{
   const p=await get('/competition/'+cfg.id+'/matches');
   const parsed=parseCompetition(p);
   const round=parsed.currentRound??1;
   if(commonRound===null) commonRound=round;

   const rows=(parsed.allMatches||[]).filter(m=>Number(m.round)===Number(round)).map(m=>{
    const isM1=/moorabbin/i.test(m.n1), isM2=/moorabbin/i.test(m.n2);
    let status='';
    if(m.completed){
      if(m.s1>m.s2) status=isM1?'WIN':(isM2?'LOSS':'');
      else if(m.s2>m.s1) status=isM2?'WIN':(isM1?'LOSS':'');
      else if(isM1||isM2) status='DRAW';
    }
    return {n1:m.n1,n2:m.n2,s1:m.completed?m.s1:null,s2:m.completed?m.s2:null,status,isM:isM1||isM2};
   });
   sections.push({cfg,round,rows});
  }catch(err){
   sections.push({cfg,round:null,rows:null,error:true});
   console.error('Consolidated results:',err);
  }
 }

 const titleRound=commonRound===null?'':` — ROUND ${commonRound}`;
 const cards=sections.map(sec=>{
   let body='';
   if(sec.error){
     body='<tr><td colspan="4" class="cr-error">Unable to load results — retrying…</td></tr>';
   }else if(!sec.rows.length){
     body='<tr><td colspan="4" class="cr-error">No matches found for the current round</td></tr>';
   }else{
     body=sec.rows.map(x=>{
       const played=x.s1!==null&&x.s2!==null;
       return `<tr class="${x.isM?'moorabbin ':''}${played?'':'pending'}">
         <td class="team">${esc(x.n1)}</td>
         <td class="score">${played?`${x.s1} — ${x.s2}`:'—'}</td>
         <td class="team">${esc(x.n2)}</td>
         <td class="status">${esc(x.status)}</td>
       </tr>`;
     }).join('');
   }
   return `<section class="cr-card">
      <div class="cr-head"><span>${esc(sec.cfg.label)}</span><small>${esc(sec.cfg.side)}</small></div>
      <table class="cr-table">
       <thead><tr><th>Home</th><th>Score</th><th>Away</th><th></th></tr></thead>
       <tbody>${body}</tbody>
      </table>
    </section>`;
 }).join('');

 host.innerHTML=`<div class="consolidated-results-screen">
   <div class="cr-title">SATURDAY PENNANT${titleRound}</div>
   <div class="cr-grid">${cards}</div>
 </div>`;
}

 const stats={};const ensure=id=>stats[id]??={played:0,wins:0,losses:0,draws:0,score:0,against:0,points:0};
 for(const m of parsed.allMatches||[]){

  const a=ensure(m.c1),b=ensure(m.c2);a.played++;b.played++;a.score+=Number(m.s1||0);a.against+=Number(m.s2||0);b.score+=Number(m.s2||0);b.against+=Number(m.s1||0);
  const winner=m.winner||m.apiWinner||null;let p1=Number(m.p1||0),p2=Number(m.p2||0);
  const rinks=rinkResultsFromDetail(await getMatchDetail(m.id),m.c1,m.c2);
  if(!/forfeit|walkover/.test(String(m.resultStatus||'').toLowerCase())&&rinks.length){
   const base1=m.s1>m.s2?6:m.s1===m.s2?3:0,base2=m.s2>m.s1?6:m.s1===m.s2?3:0;let r1=0,r2=0;
   for(const r of rinks){if(r.s1>r.s2)r1+=2;else if(r.s2>r.s1)r2+=2;else{r1++;r2++;}}
   p1=base1+r1;p2=base2+r2;
  }
  a.points+=p1;b.points+=p2;if(winner===m.c1){a.wins++;b.losses++;}else if(winner===m.c2){b.wins++;a.losses++;}else{a.draws++;b.draws++;}
 }
 return Object.entries(stats).map(([id,s])=>({id,name:parsed.competitors[id]?.name||'Unknown',...s,diff:s.score-s.against})).sort((a,b)=>b.points-a.points||b.diff-a.diff||b.score-a.score).map((x,i)=>({...x,pos:i+1}));
}
async function loadTuesdayLadders(){

 for(const cfg of TUESDAY){try{const parsed=parseCompetition(await get('/competition/'+cfg.id+'/matches'));const ladder=await computeTuesdayLadder(parsed);
  const rows=ladder.map(x=>`<tr class="${/moorabbin/i.test(x.name)?'highlight':''}"><td>${x.pos}</td><td>${esc(x.name)}</td><td>${x.played}</td><td>${x.wins}</td><td>${x.losses}</td><td>${x.draws}</td><td>${x.points}</td></tr>`).join('');
  cards.push(`<section class="tuesday-card"><h3>${esc(cfg.side)}</h3><div class="tn-meta">${esc(parsed.name||'')}</div><table><thead><tr><th>Pos</th><th>Club</th><th>P</th><th>W</th><th>L</th><th>D</th><th>Pts</th></tr></thead><tbody>${rows||'<tr><td colspan="7">No ladder data</td></tr>'}</tbody></table></section>`);
 }catch(e){console.error('Tuesday ladder:',cfg.side,e);cards.push(`<section class="tuesday-card"><h3>${esc(cfg.side)}</h3><div class="notice error">Unable to read BowlsLink — retrying…</div></section>`);}}
 host.innerHTML=`<div class="tuesday-screen-wrap"><div class="tn-title">TUESDAY NIGHT LADDERS <span style="font-size:.48em">• 6 POINTS FOR A WIN</span></div><div class="tuesday-grid">${cards.join('')}</div></div>`;
}
async function loadMidweekResults(){
 const host=document.getElementById('midweekResults');if(!host)return;
 const cards=[];
 for(const cfg of MIDWEEK){
  try{
   const parsed=parseCompetition(await get('/competition/'+cfg.id+'/matches'));
   const played=(parsed.allMatches||[]).filter(m=>m.completed&&(/moorabbin/i.test(m.n1)||/moorabbin/i.test(m.n2)));
   played.sort((a,b)=>(Number(b.round)||0)-(Number(a.round)||0)||(Date.parse(b.dateUtc||'')||0)-(Date.parse(a.dateUtc||'')||0));
   const m=played[0];
   let body='<div class="notice">No completed Moorabbin result yet.</div>';
   if(m){
    const mo1=/moorabbin/i.test(m.n1);
    const status=m.winner===null?'draw':(m.winner===(mo1?m.c1:m.c2)?'win':'loss');
    body=`<div class="mw-match"><div>${esc(m.n1)}</div><div class="mw-score">${m.s1} — ${m.s2}</div><div>${esc(m.n2)}</div><div class="mw-status ${status}">${status.toUpperCase()}</div></div>`;
   }
   cards.push(`<section class="midweek-result-card"><h3>${esc(cfg.side)}</h3>${body}</section>`);
  }catch(e){
   console.error('Midweek result:',cfg.side,e);
   cards.push(`<section class="midweek-result-card"><h3>${esc(cfg.side)}</h3><div class="notice error">Unable to read BowlsLink — retrying…</div></section>`);
  }
 }
 host.innerHTML=`<div class="midweek-results-wrap"><div class="mw-result-title">MIDWEEK — MOORABBIN RESULTS</div><div class="midweek-results-grid">${cards.join('')}</div></div>`;
}

async function loadTuesdayResults(){
 const host=document.getElementById('tuesdayResults');if(!host)return;const cards=[];
 for(const cfg of TUESDAY){try{const parsed=parseCompetition(await get('/competition/'+cfg.id+'/matches'));const played=(parsed.allMatches||[]).filter(m=>m.completed&&(/moorabbin/i.test(m.n1)||/moorabbin/i.test(m.n2)));
  played.sort((a,b)=>(Number(b.round)||0)-(Number(a.round)||0)||(Date.parse(b.dateUtc||'')||0)-(Date.parse(a.dateUtc||'')||0));const m=played[0];let body='<div class="notice">No completed Moorabbin result yet.</div>';
  if(m){const mo1=/moorabbin/i.test(m.n1),status=m.winner===null?'draw':(m.winner===(mo1?m.c1:m.c2)?'win':'loss');body=`<div class="tn-match"><div>${esc(m.n1)}</div><div class="tn-score">${m.s1} — ${m.s2}</div><div>${esc(m.n2)}</div><div class="tn-status ${status}">${status.toUpperCase()}</div></div>`;}
  cards.push(`<section class="tuesday-result-card"><h3>${esc(cfg.side)}</h3>${body}</section>`);
 }catch(e){console.error('Tuesday result:',cfg.side,e);cards.push(`<section class="tuesday-result-card"><h3>${esc(cfg.side)}</h3><div class="notice error">Unable to read BowlsLink — retrying…</div></section>`);}}
 host.innerHTML=`<div class="tuesday-results-wrap"><div class="tn-title">TUESDAY NIGHT — MOORABBIN RESULTS</div><div class="tuesday-results-grid">${cards.join('')}</div></div>`;
}

async function loadAll(){
 const jobs=[
  ['Saturday consolidated results',loadConsolidatedResults],
  ['Saturday ladders',loadSaturdayLadders],
  ['Midweek ladders',loadMidweekLadders],
  ['Midweek results',loadMidweekResults],
  ['Tuesday ladders',loadTuesdayLadders],
  ['Tuesday results',loadTuesdayResults]
 ];
 const results=await Promise.allSettled(jobs.map(([,fn])=>fn()));
 const failures=results.filter(r=>r.status==='rejected').length;
 results.forEach((r,i)=>{if(r.status==='rejected')console.error(jobs[i][0],r.reason);});
 document.getElementById('updated').textContent='BowlsLink updated '+new Date().toLocaleTimeString()+(failures?' • retrying failed section(s)':'');
}
function buildScreens(){
 const root=document.getElementById('screens');
 root.insertAdjacentHTML('beforeend',`<section id="consolidatedResults" class="screen"></section>`);
 root.insertAdjacentHTML('beforeend',`<section id="saturdayLadders" class="screen"></section>`);
 root.insertAdjacentHTML('beforeend',`<section id="midweekLadders" class="screen"></section>`);
 root.insertAdjacentHTML('beforeend',`<section id="midweekResults" class="screen"></section>`);
 root.insertAdjacentHTML('beforeend',`<section id="tuesdayLadders" class="screen"></section>`);
 root.insertAdjacentHTML('beforeend',`<section id="tuesdayResults" class="screen"></section>`);
 screens=[...document.querySelectorAll('.screen')];show();
}
function show(){screens.forEach((s,i)=>s.classList.toggle('active',i===screenIndex))}
function next(){screenIndex=(screenIndex+1)%screens.length;show()}
function prev(){screenIndex=(screenIndex-1+screens.length)%screens.length;show()}
function pauseResume(){running=!running;document.querySelector('.controls button:nth-child(2)').textContent=running?'Pause':'Resume'}
buildScreens();
loadAll();
setInterval(loadAll,15000);
setInterval(()=>{if(running)next()},10000);
</script>
